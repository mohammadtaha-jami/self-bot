<header class="bg-slate-800 border-b border-slate-700 p-4">
    <div class="max-w-7xl mx-auto flex flex-wrap gap-4 justify-between items-center">
        <div class="flex flex-wrap items-center gap-4">
            <span class="text-lg font-bold text-blue-400">پنل مدیریت سیستم</span>
            <nav class="flex flex-wrap gap-2 text-sm">
                <a href="/" class="px-3 py-1.5 rounded-lg {% if request.url.path == '/' or request.url.path == '/admin' %}bg-slate-700 text-emerald-400{% else %}text-slate-300 hover:bg-slate-700{% endif %}">صفحه اصلی</a>
                <a href="/users" class="px-3 py-1.5 rounded-lg {% if request.url.path == '/users' %}bg-slate-700 text-emerald-400{% else %}text-slate-300 hover:bg-slate-700{% endif %}">کاربران</a>
                <a href="/sessions" class="px-3 py-1.5 rounded-lg {% if request.url.path == '/sessions' %}bg-slate-700 text-emerald-400{% else %}text-slate-300 hover:bg-slate-700{% endif %}">سشن‌های تلگرام</a>
            </nav>
        </div>
        <button type="button" onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg">خروج</button>
    </div>
</header>
