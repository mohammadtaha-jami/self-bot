<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کاربران سیستم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>body { font-family: 'Vazirmatn', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    {% include "includes/admin_nav.html" %}

    <main class="max-w-7xl mx-auto p-6">
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4 text-blue-400">مدیریت کاربران سیستم</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-900 text-slate-400">
                        <tr>
                            <th class="p-3">شناسه</th>
                            <th class="p-3">نام کاربری لاگین</th>
                            <th class="p-3">شماره تلفن</th>
                            <th class="p-3">آیدی تلگرام</th>
                            <th class="p-3">نام کامل</th>
                            <th class="p-3">رمز داشبورد</th>
                            <th class="p-3">وضعیت</th>
                            <th class="p-3">تاریخ انقضای لایسنس</th>
                            <th class="p-3">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-slate-700"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="edit-user-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60">
        <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-xl p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-blue-400">ویرایش کاربر</h3>
                <button type="button" onclick="closeEditUserModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            <form id="edit-user-form" class="space-y-4" onsubmit="return false;">
                <input type="hidden" id="edit-user-id">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">نام نمایشی</label>
                    <input type="text" id="edit-full-name" maxlength="100" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">نام کاربری لاگین</label>
                    <input type="text" id="edit-username" maxlength="100" dir="ltr" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-left focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">شماره تلفن</label>
                    <input type="text" id="edit-phone" dir="ltr" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-left focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">نوع کسب‌وکار</label>
                    <select id="edit-business-type" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="general">عمومی (general)</option>
                        <option value="real_estate">املاک (real_estate)</option>
                        <option value="crypto">کریپتو (crypto)</option>
                        <option value="programmer">برنامه‌نویس (programmer)</option>
                        <option value="web_designer">طراح وب (web_designer)</option>
                        <option value="seo_specialist">سئو (seo_specialist)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">رمز عبور جدید (خالی = بدون تغییر)</label>
                    <input type="text" id="edit-password" minlength="6" dir="ltr" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-left focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">مدت لایسنس جدید (روز، اختیاری)</label>
                    <input type="number" id="edit-license-days" min="1" placeholder="مثلاً ۳۰" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
                <label class="flex items-center gap-2 text-sm text-slate-300">
                    <input type="checkbox" id="edit-is-active" class="rounded border-slate-600">
                    کاربر فعال باشد
                </label>
                <div id="edit-user-status" class="text-sm font-semibold"></div>
                <div class="flex gap-2">
                    <button type="button" onclick="submitEditUser()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg font-bold">ذخیره</button>
                    <button type="button" onclick="closeEditUserModal()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg">انصراف</button>
                </div>
            </form>
        </div>
    </div>

    {% include "includes/admin_common.html" %}
    <script>
        let usersById = {};

        async function loadUsers() {
            const tbody = document.getElementById("users-table-body");
            tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-slate-400 text-center">در حال بارگذاری...</td></tr>';
            try {
                const res = await fetch("/api/v1/admin/users", { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) {
                    tbody.innerHTML = `<tr><td colspan="9" class="p-4 text-rose-400 text-center">${escapeHtml(data.detail || "خطا در دریافت کاربران")}</td></tr>`;
                    return;
                }
                if (!Array.isArray(data) || data.length === 0) {
                    usersById = {};
                    tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-slate-500 text-center">کاربری یافت نشد.</td></tr>';
                    return;
                }
                usersById = Object.fromEntries(data.map((user) => [String(user.id), user]));
                tbody.innerHTML = data.map((user) => {
                    const passwordCell = user.is_admin
                        ? '<span class="text-slate-500">—</span>'
                        : `<span class="font-mono dir-ltr">${escapeHtml(user.dashboard_password || "—")}</span>`;
                    const deleteBtn = user.is_admin
                        ? ""
                        : `<button type="button" onclick="deleteUser(${user.id})"
                            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white">حذف</button>`;
                    return `
                    <tr class="hover:bg-slate-700/30">
                        <td class="p-3 font-mono">${user.id}</td>
                        <td class="p-3">${escapeHtml(user.username)}</td>
                        <td class="p-3 font-mono dir-ltr">${escapeHtml(user.phone_number || "—")}</td>
                        <td class="p-3 font-mono dir-ltr">${escapeHtml(user.telegram_username || "—")}</td>
                        <td class="p-3">${escapeHtml(user.full_name || "—")}</td>
                        <td class="p-3">${passwordCell}</td>
                        <td class="p-3">${statusBadge(user.is_active)}</td>
                        <td class="p-3 whitespace-nowrap">${escapeHtml(formatLicenseDate(user.license_expires_at))}</td>
                        <td class="p-3">
                            <div class="flex flex-wrap gap-2">
                                <button type="button" onclick="openEditUserModal(${user.id})"
                                    class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-600 hover:bg-slate-500 text-white">
                                    ویرایش
                                </button>
                                <button type="button" onclick="toggleUserActive(${user.id})"
                                    class="px-3 py-1.5 rounded-lg text-xs font-semibold ${user.is_active ? "bg-amber-600 hover:bg-amber-500" : "bg-emerald-600 hover:bg-emerald-500"} text-white">
                                    ${user.is_active ? "غیرفعال‌سازی" : "فعال‌سازی"}
                                </button>
                                ${user.is_admin ? "" : `<button type="button" onclick="enterUserDashboard(${user.id})"
                                    class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white">
                                    ورود به پنل
                                </button>`}
                                <button type="button" onclick="renewUserLicense(${user.id})"
                                    class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white">
                                    تمدید لایسنس
                                </button>
                                ${deleteBtn}
                            </div>
                        </td>
                    </tr>`;
                }).join("");
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="9" class="p-4 text-rose-400 text-center">خطا در ارتباط با سرور</td></tr>';
            }
        }

        function openEditUserModal(userId) {
            const user = usersById[String(userId)];
            if (!user) return;
            document.getElementById("edit-user-id").value = String(user.id);
            document.getElementById("edit-full-name").value = user.full_name || "";
            document.getElementById("edit-username").value = user.username || "";
            document.getElementById("edit-phone").value = user.phone_number || "";
            const biz = document.getElementById("edit-business-type");
            const known = [...biz.options].some((opt) => opt.value === (user.business_type || ""));
            if (user.business_type && !known) {
                const extra = document.createElement("option");
                extra.value = user.business_type;
                extra.textContent = user.business_type;
                biz.appendChild(extra);
            }
            biz.value = user.business_type || "general";
            document.getElementById("edit-password").value = "";
            document.getElementById("edit-license-days").value = "";
            document.getElementById("edit-is-active").checked = Boolean(user.is_active);
            document.getElementById("edit-user-status").innerText = "";
            document.getElementById("edit-user-modal").classList.remove("hidden");
        }

        function closeEditUserModal() {
            document.getElementById("edit-user-modal").classList.add("hidden");
        }

        async function submitEditUser() {
            const userId = document.getElementById("edit-user-id").value;
            const statusDiv = document.getElementById("edit-user-status");
            const password = document.getElementById("edit-password").value;
            const daysRaw = document.getElementById("edit-license-days").value.trim();
            const body = {
                full_name: document.getElementById("edit-full-name").value.trim(),
                username: document.getElementById("edit-username").value.trim(),
                phone_number: document.getElementById("edit-phone").value.trim(),
                business_type: document.getElementById("edit-business-type").value || null,
                is_active: document.getElementById("edit-is-active").checked,
            };
            if (password) body.password = password;
            if (daysRaw) {
                const days = parseInt(daysRaw, 10);
                if (!Number.isInteger(days) || days <= 0) {
                    statusDiv.className = "text-sm font-semibold text-rose-400";
                    statusDiv.innerText = "مدت لایسنس باید عدد بزرگ‌تر از صفر باشد.";
                    return;
                }
                body.license_days = days;
            }
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}`, {
                    method: "PUT",
                    headers: authHeaders(true),
                    body: JSON.stringify(body),
                });
                const data = await res.json().catch(() => null);
                if (!res.ok) {
                    statusDiv.className = "text-sm font-semibold text-rose-400";
                    const detail = data && (typeof data.detail === "string" ? data.detail : (data.detail && data.detail[0] && data.detail[0].msg) || "ذخیره نشد.");
                    statusDiv.innerText = detail;
                    return;
                }
                closeEditUserModal();
                await loadUsers();
            } catch (err) {
                console.error(err);
                statusDiv.className = "text-sm font-semibold text-rose-400";
                statusDiv.innerText = "خطا در ارتباط با سرور";
            }
        }

        async function enterUserDashboard(userId) {
            const adminToken = localStorage.getItem("access_token");
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}/impersonate`, {
                    method: "POST",
                    headers: authHeaders(),
                    credentials: "include",
                });
                const data = await res.json().catch(() => null);
                if (!res.ok) {
                    alert((data && data.detail) || "ورود به پنل کاربر انجام نشد.");
                    return;
                }
                if (adminToken) {
                    sessionStorage.setItem("admin_return_token", adminToken);
                }
                localStorage.setItem("access_token", data.access_token);
                window.location.href = "/dashboard";
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        async function toggleUserActive(userId) {
            if (!confirm("وضعیت دسترسی این کاربر تغییر کند؟")) return;
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}/toggle-active`, {
                    method: "PATCH",
                    headers: authHeaders(),
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "تغییر وضعیت انجام نشد.");
                    return;
                }
                await loadUsers();
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        async function renewUserLicense(userId) {
            const raw = prompt("تعداد روز تمدید لایسنس را وارد کنید:", "30");
            if (raw === null) return;
            const days = parseInt(raw, 10);
            if (!Number.isInteger(days) || days <= 0) {
                alert("تعداد روز باید عدد صحیح بزرگ‌تر از صفر باشد.");
                return;
            }
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}/renew-license`, {
                    method: "POST",
                    headers: authHeaders(true),
                    body: JSON.stringify({ days }),
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "تمدید لایسنس انجام نشد.");
                    return;
                }
                await loadUsers();
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        async function deleteUser(userId) {
            if (!confirm("این کاربر و سشن‌های مرتبط حذف شوند؟")) return;
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}`, {
                    method: "DELETE",
                    headers: authHeaders(),
                });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    alert(data.detail || "حذف کاربر انجام نشد.");
                    return;
                }
                await loadUsers();
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        guardAdminPage().then((ok) => {
            if (ok) loadUsers();
        });
    </script>
</body>
</html>
