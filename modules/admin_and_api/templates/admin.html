<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - Telegram Lead Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <header class="bg-slate-800 border-b border-slate-700 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-400">پنل مدیریت سیستم</h1>
            <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg">خروج</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        <!-- کارت ۱: مدیریت اتصال تلگرام -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4 text-emerald-400">اتصال حساب تلگرام (شنونده)</h2>
            
            <div class="space-y-4 max-w-md mb-6">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">نوع کسب‌وکار (business_type)</label>
                    <select id="business-type" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="general">عمومی (general)</option>
                        <option value="real_estate">املاک (real_estate)</option>
                        <option value="crypto">کریپتو (crypto)</option>
                        <option value="programmer">برنامه‌نویس (programmer)</option>
                        <option value="web_designer">طراح وب (web_designer)</option>
                        <option value="seo_specialist">سئو (seo_specialist)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">اتصال سشن به کاربر</label>
                    <select id="target-user-id" onchange="onTargetUserChange()" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                        <option value="">ایجاد کاربر جدید</option>
                    </select>
                </div>
                <div id="new-username-wrap">
                    <label class="block text-sm text-slate-300 mb-1">نام کاربری کاربر جدید</label>
                    <input type="text" id="new-username" placeholder="مثلاً listener_01" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- مرحله اول: دریافت شماره -->
            <div id="step-send-code" class="space-y-4 max-w-md">
                <label class="block text-sm text-slate-300 mb-1">شماره تلفن اکانت تلگرام (با کد کشور)</label>
                <div class="flex gap-2">
                    <input type="text" id="phone-number" placeholder="+989123456789" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-left dir-ltr focus:outline-none focus:border-blue-500">
                    <button onclick="sendCode()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg whitespace-nowrap">ارسال کد</button>
                </div>
            </div>

            <!-- مرحله دوم: ورود کد تایید (پنهان در ابتدا) -->
            <div id="step-verify-code" class="space-y-4 max-w-md hidden">
                <label class="block text-sm text-slate-300">کد ۵ رقمی دریافتی در تلگرام</label>
                <input type="text" id="telegram-code" placeholder="12345" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-center dir-ltr text-xl tracking-widest focus:outline-none focus:border-blue-500">
                
                <div id="2fa-container" class="hidden space-y-2">
                    <label class="block text-sm text-slate-300">رمز عبور دو مرحله‌ای (2FA)</label>
                    <input type="password" id="two-factor-pass" placeholder="Password" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500">
                </div>

                <button onclick="verifyCode()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-bold">تایید و برقراری اتصال</button>
            </div>

            <div id="connection-status" class="mt-4 text-sm font-semibold"></div>
        </section>

        <!-- کارت ۲: لیست کاربران و تمدید لایسنس -->
        <section class="bg-slate-800 border border-slate-700 rounded-xl p-6">
            <h2 class="text-lg font-bold mb-4 text-blue-400">مدیریت کاربران سیستم</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-right text-sm">
                    <thead class="bg-slate-900 text-slate-400">
                        <tr>
                            <th class="p-3">شناسه</th>
                            <th class="p-3">نام کاربری</th>
                            <th class="p-3">نام کامل</th>
                            <th class="p-3">وضعیت</th>
                            <th class="p-3">تاریخ انقضای لایسنس</th>
                            <th class="p-3">عملیات</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body" class="divide-y divide-slate-700">
                        <!-- داده‌های کاربران از طریق JS بارگذاری می‌شوند -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        async function guardAdminPage() {
            const accessToken = localStorage.getItem("access_token");
            if (!accessToken) {
                window.location.href = "/login";
                return null;
            }
            try {
                const res = await fetch("/api/v1/auth/me", {
                    headers: { "Authorization": `Bearer ${accessToken}` }
                });
                if (!res.ok) {
                    localStorage.removeItem("access_token");
                    window.location.href = "/login";
                    return null;
                }
                const user = await res.json();
                if (!user.is_admin) {
                    alert("عدم دسترسی");
                    window.location.href = "/dashboard";
                    return null;
                }
                return accessToken;
            } catch (err) {
                window.location.href = "/login";
                return null;
            }
        }

        guardAdminPage().then((ok) => {
            if (ok) loadUsers();
        });

        const token = localStorage.getItem("access_token");

        let phoneCodeHash = "";
        let currentPhone = "";

        function authHeaders(json = false) {
            const headers = { "Authorization": `Bearer ${token}` };
            if (json) headers["Content-Type"] = "application/json";
            return headers;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function formatLicenseDate(iso) {
            if (!iso) return "بدون لایسنس";
            const date = new Date(iso);
            if (Number.isNaN(date.getTime())) return "—";
            return date.toLocaleString("fa-IR", { dateStyle: "medium", timeStyle: "short" });
        }

        function statusBadge(isActive) {
            if (isActive) {
                return '<span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-400">فعال</span>';
            }
            return '<span class="inline-flex px-2.5 py-1 rounded-full text-xs font-semibold bg-rose-500/15 text-rose-400">غیرفعال</span>';
        }

        function populateTargetUserSelect(users) {
            const select = document.getElementById("target-user-id");
            const previous = select.value;
            select.innerHTML = '<option value="">ایجاد کاربر جدید</option>';
            users.forEach((user) => {
                const opt = document.createElement("option");
                opt.value = String(user.id);
                const label = user.username || ("user#" + user.id);
                const biz = user.business_type ? ` — ${user.business_type}` : "";
                opt.textContent = `#${user.id} ${label}${biz}`;
                select.appendChild(opt);
            });
            if (previous && [...select.options].some((o) => o.value === previous)) {
                select.value = previous;
            }
            onTargetUserChange();
        }

        function onTargetUserChange() {
            const isNew = !document.getElementById("target-user-id").value;
            document.getElementById("new-username-wrap").classList.toggle("hidden", !isNew);
        }

        function collectTelegramOwnerPayload() {
            const targetRaw = document.getElementById("target-user-id").value;
            const target_user_id = targetRaw ? parseInt(targetRaw, 10) : null;
            const business_type = document.getElementById("business-type").value || null;
            const username = document.getElementById("new-username").value.trim() || null;
            return { target_user_id, business_type, username: target_user_id ? null : username };
        }

        async function loadUsers() {
            const tbody = document.getElementById("users-table-body");
            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-slate-400 text-center">در حال بارگذاری...</td></tr>';
            try {
                const res = await fetch("/api/v1/admin/users", { headers: authHeaders() });
                const data = await res.json();
                if (!res.ok) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-rose-400 text-center">${escapeHtml(data.detail || "خطا در دریافت کاربران")}</td></tr>`;
                    return;
                }
                if (!Array.isArray(data) || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-slate-500 text-center">کاربری یافت نشد.</td></tr>';
                    populateTargetUserSelect([]);
                    return;
                }
                populateTargetUserSelect(data);
                tbody.innerHTML = data.map((user) => `
                    <tr class="hover:bg-slate-700/30">
                        <td class="p-3 font-mono">${user.id}</td>
                        <td class="p-3">${escapeHtml(user.username)}</td>
                        <td class="p-3">${escapeHtml(user.full_name || "—")}</td>
                        <td class="p-3">${statusBadge(user.is_active)}</td>
                        <td class="p-3 whitespace-nowrap">${escapeHtml(formatLicenseDate(user.license_expires_at))}</td>
                        <td class="p-3">
                            <div class="flex flex-wrap gap-2">
                                <button type="button" onclick="toggleUserActive(${user.id})"
                                    class="px-3 py-1.5 rounded-lg text-xs font-semibold ${user.is_active ? "bg-amber-600 hover:bg-amber-500" : "bg-emerald-600 hover:bg-emerald-500"} text-white">
                                    ${user.is_active ? "غیرفعال‌سازی" : "فعال‌سازی"}
                                </button>
                                <button type="button" onclick="renewUserLicense(${user.id})"
                                    class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-blue-600 hover:bg-blue-500 text-white">
                                    تمدید لایسنس
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join("");
            } catch (err) {
                console.error(err);
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-rose-400 text-center">خطا در ارتباط با سرور</td></tr>';
            }
        }

        async function toggleUserActive(userId) {
            if (!confirm("وضعیت دسترسی این کاربر تغییر کند؟")) return;
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}/toggle-active`, {
                    method: "PATCH",
                    headers: authHeaders(),
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "تغییر وضعیت انجام نشد.");
                    return;
                }
                await loadUsers();
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        async function renewUserLicense(userId) {
            const raw = prompt("تعداد روز تمدید لایسنس را وارد کنید:", "30");
            if (raw === null) return;
            const days = parseInt(raw, 10);
            if (!Number.isInteger(days) || days <= 0) {
                alert("تعداد روز باید عدد صحیح بزرگ‌تر از صفر باشد.");
                return;
            }
            try {
                const res = await fetch(`/api/v1/admin/users/${userId}/renew-license`, {
                    method: "POST",
                    headers: authHeaders(true),
                    body: JSON.stringify({ days }),
                });
                const data = await res.json();
                if (!res.ok) {
                    alert(data.detail || "تمدید لایسنس انجام نشد.");
                    return;
                }
                await loadUsers();
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        async function sendCode() {
            currentPhone = document.getElementById("phone-number").value.trim();
            const statusDiv = document.getElementById("connection-status");
            
            if (!currentPhone) {
                alert("لطفاً شماره تلفن را وارد کنید.");
                return;
            }

            try {
                const res = await fetch("/api/v1/telegram/send-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ phone_number: currentPhone })
                });

                const data = await res.json();
                if (res.ok) {
                    phoneCodeHash = data.phone_code_hash;
                    document.getElementById("step-send-code").classList.add("hidden");
                    document.getElementById("step-verify-code").classList.remove("hidden");
                    statusDiv.className = "mt-4 text-sm text-emerald-400";
                    statusDiv.innerText = "کد تایید به تلگرام ارسال شد.";
                } else {
                    alert(data.detail || "خطا در ارسال کد");
                }
            } catch (err) {
                console.error(err);
                alert("خطا در ارتباط با سرور");
            }
        }

        async function verifyCode() {
            const code = document.getElementById("telegram-code").value.trim();
            const twoFactorPass = document.getElementById("two-factor-pass").value.trim();
            const statusDiv = document.getElementById("connection-status");

            try {
                const res = await fetch("/api/v1/telegram/verify-code", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        phone_number: currentPhone,
                        phone_code_hash: phoneCodeHash,
                        code: code,
                        two_factor_password: twoFactorPass || null,
                        ...collectTelegramOwnerPayload()
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    statusDiv.className = "mt-4 text-sm text-emerald-400";
                    statusDiv.innerText = data.message || "اتصال تلگرام با موفقیت برقرار شد!";
                    document.getElementById("step-verify-code").classList.add("hidden");
                    document.getElementById("step-send-code").classList.remove("hidden");
                    await loadUsers();
                } else {
                    if (data.detail === "2FA_REQUIRED") {
                        document.getElementById("2fa-container").classList.remove("hidden");
                        alert("لطفاً رمز دو مرحله‌ای حساب تلگرام خود را وارد کنید.");
                    } else {
                        alert(data.detail || "کد اشتباه است");
                    }
                }
            } catch (err) {
                console.error(err);
                alert("خطا در برقراری اتصال");
            }
        }

        function logout() {
            localStorage.clear();
            fetch("/api/v1/auth/logout", { method: "POST", credentials: "include" })
                .finally(() => { window.location.href = "/login"; });
        }
    </script>
</body>
</html>
