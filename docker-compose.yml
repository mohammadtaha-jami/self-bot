version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: telegram_listener_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telegram_listener}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-telegram_listener}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telegram_listener}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: telegram_listener_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_listener_listener
    restart: unless-stopped
    command: python -m modules.listener.app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # volumes:
    #   - .:/app

  processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_listener_processor
    restart: unless-stopped
    command: python -m modules.processor.worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # volumes:
    #   - .:/app

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_listener_api
    restart: unless-stopped
    command: uvicorn modules.admin_and_api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # volumes:
    #   - .:/app

volumes:
  postgres_data:
  redis_data:
